suite: network policy
templates:
  - templates/networkpolicy.yaml
tests:
  - it: lets anyone reach the tunnel port, and nothing else in
    asserts:
      - equal: { path: spec.policyTypes, value: [Ingress, Egress] }
      - equal: { path: spec.ingress, value: [{ ports: [{ protocol: UDP, port: 2302 }] }] }

  - it: allows DNS, TCP 1883 and 443 and all UDP to public addresses only
    asserts:
      - equal: { path: 'spec.egress[0].ports', value: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }] }
      - equal: { path: 'spec.egress[1].to[0].ipBlock.cidr', value: 0.0.0.0/0 }
      - contains: { path: 'spec.egress[1].to[0].ipBlock.except', content: 10.0.0.0/8 }
      - contains: { path: 'spec.egress[1].to[0].ipBlock.except', content: 192.168.0.0/16 }
      - equal: { path: 'spec.egress[1].ports', value: [{ protocol: TCP, port: 1883 }, { protocol: TCP, port: 443 }, { protocol: UDP }] }

  - it: lets webFrom reach the web port
    set:
      networkPolicy.webFrom: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
    asserts:
      - equal:
          path: 'spec.ingress[1]'
          value: { ports: [{ protocol: TCP, port: 8080 }], from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }] }

  - it: narrows the players' sources and follows the tunnel port
    set:
      network.tunnelPort: 2303
      networkPolicy.from: [{ ipBlock: { cidr: 198.51.100.0/24 } }]
    asserts:
      - equal:
          path: spec.ingress
          value: [{ ports: [{ protocol: UDP, port: 2303 }], from: [{ ipBlock: { cidr: 198.51.100.0/24 } }] }]

  - it: renders nothing when off
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
