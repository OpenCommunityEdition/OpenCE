suite: secret
templates:
  - templates/secret.yaml
release:
  name: opence-server
tests:
  - it: makes a web password when none is given
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Secret }
      - equal: { path: metadata.name, value: opence-server-secrets }
      - matchRegex: { path: data.web-password, pattern: "^[A-Za-z0-9+/]{32}$" }

  - it: keeps a given web password, join password and publisher key
    set:
      web.password: correct-horse
      server.password.value: letmein
      publisherKey.value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    asserts:
      - equal: { path: data.web-password, value: Y29ycmVjdC1ob3JzZQ== }
      - equal: { path: data.password, value: bGV0bWVpbg== }
      - exists: { path: data.publisher-key }

  - it: refuses a short web password
    set:
      web.password: short
    asserts:
      - failedTemplate:
          errorPattern: "8 characters or more"

  - it: refuses a publisher key that is not 64 hex characters
    set:
      publisherKey.value: not-a-key
    asserts:
      - failedTemplate:
          errorPattern: "64 lower-case hex"

  - it: makes none when every secret comes from elsewhere
    set:
      web.existingSecret: halo-web
    asserts:
      - hasDocuments: { count: 0 }

  - it: makes none without a web port or secrets
    set:
      web.port: 0
    asserts:
      - hasDocuments: { count: 0 }
