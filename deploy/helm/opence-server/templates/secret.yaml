{{- $data := dict }}
{{- if and (gt (int .Values.web.port) 0) (not .Values.web.existingSecret) }}
{{- $password := .Values.web.password }}
{{- if $password }}
{{- if lt (len $password) 8 }}
{{- fail "web.password: 8 characters or more (the server refuses a shorter one beyond loopback)" }}
{{- end }}
{{- else }}
{{- /* made once, then kept from the Secret the release already has */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "opence-server.secretName" .) }}
{{- if and $existing $existing.data (hasKey $existing.data .Values.web.key) }}
{{- $password = index $existing.data .Values.web.key | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
{{- $_ := set $data .Values.web.key ($password | b64enc) }}
{{- with .Values.web.moderatorPassword }}
{{- if lt (len .) 8 }}
{{- fail "web.moderatorPassword: 8 characters or more" }}
{{- end }}
{{- $_ := set $data $.Values.web.moderatorKey (. | b64enc) }}
{{- end }}
{{- end }}
{{- if and .Values.server.password.value (not .Values.server.password.existingSecret) }}
{{- $_ := set $data .Values.server.password.key (.Values.server.password.value | b64enc) }}
{{- end }}
{{- if and .Values.publisherKey.value (not .Values.publisherKey.existingSecret) }}
{{- if not (regexMatch "^[0-9a-f]{64}$" .Values.publisherKey.value) }}
{{- fail "publisherKey.value: the 64 lower-case hex characters of the seed (halo --server --keygen)" }}
{{- end }}
{{- $_ := set $data .Values.publisherKey.key (.Values.publisherKey.value | b64enc) }}
{{- end }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opence-server.secretName" . }}
  labels:
    {{- include "opence-server.labels" . | nindent 4 }}
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
