[package]
name = "opence_dev"
description = "The developer's tools: a registry of commands and variables, shared by the shell, the control socket and the test driver"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
serde_json = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tracy = { workspace = true, optional = true }
libm.workspace = true

[features]
# the spans and events sent to a Tracy viewer as well (it builds Tracy's
# C++ client)
tracy = ["dep:tracing-tracy"]

[dev-dependencies]
insta.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
