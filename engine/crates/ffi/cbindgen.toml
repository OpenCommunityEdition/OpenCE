# opence_snapshot.h, the snapshot's types for Swift (tools/engine_build.py)
language = "C"
include_guard = "OPENCE_SNAPSHOT_H"
autogen_warning = "/* Written by cbindgen from engine/crates/ffi/src/snapshot.rs; do not edit. */"
usize_is_size_t = true
style = "type"
cpp_compat = true

[export]
include = ["FrameSnapshot", "ObjectSnapshot", "NodeSnapshot", "NodeMatrix", "CameraSnapshot", "Transform", "Vec3", "Quat", "LightSnapshot", "ClusterView"]
item_types = ["structs", "opaque", "functions", "constants"]
prefix = "OCE"

[const]
allow_static_const = false

[parse]
parse_deps = false

[export.rename]
# (the prefix is added after the rename)
"MAX_OBJECTS" = "_MAX_OBJECTS"
"MAX_NODES" = "_MAX_NODES"
"SNAPSHOT_VERSION" = "_SNAPSHOT_VERSION"
"OBJECT_FIRST_PERSON" = "_OBJECT_FIRST_PERSON"
"MAX_LIGHTS" = "_MAX_LIGHTS"
"LIGHT_SPOT" = "_LIGHT_SPOT"
"LIGHT_NO_SPECULAR" = "_LIGHT_NO_SPECULAR"
"LIGHT_FIRST_PERSON" = "_LIGHT_FIRST_PERSON"
"CLUSTER_X" = "_CLUSTER_X"
"CLUSTER_Y" = "_CLUSTER_Y"
"CLUSTER_Z" = "_CLUSTER_Z"
"CLUSTER_CELLS" = "_CLUSTER_CELLS"
"MAX_CLUSTER_INDICES" = "_MAX_CLUSTER_INDICES"
