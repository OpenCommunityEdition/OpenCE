# The new engine (conductor/tracks/native_engine_20261021): Rust owns the
# content, the simulation, the scripts, the physics and the network; the
# Swift app (engine/app) reaches it only through the ffi crate.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
publish = false
rust-version = "1.98"

[workspace.dependencies]
opence_bake = { path = "crates/bake" }
opence_content = { path = "crates/content" }
opence_import = { path = "crates/import" }
opence_sim = { path = "crates/sim" }
opence_physics = { path = "crates/physics" }
opence_script = { path = "crates/script" }
opence_dev = { path = "crates/dev" }
opence_net = { path = "crates/net" }
opence_campaign = { path = "crates/campaign" }
opence_ui = { path = "crates/ui" }
opence_audio = { path = "crates/audio" }
thiserror = "2"
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "alloc"] }
libm = "0.2"
# (the tests' snapshots of text, and their diffs)
insta = { version = "1.43", default-features = false }
pretty_assertions = "1.4"
# (the sounds resampled to the output's rate once, as they are decoded)
rubato = { version = "5.0", default-features = false, features = ["fft_resampler"] }
# (the bake's CPU side, split over the cores; each result kept in order)
rayon = "1.10"
# (the engine's allocator, counted for `stat allocations`; the nightly
# feature only makes StatsAlloc::new a const fn, which stable allows)
mimalloc = { version = "0.1", default-features = false }
stats_alloc = { version = "0.1", default-features = false, features = ["nightly"] }
# (the benchmarks: `cargo bench`, and `cargo test --benches` runs each once)
divan = { version = "0.1", default-features = false }
proptest = { version = "1.7", default-features = false, features = ["std"] }
# (hash maps with a fixed seed: the same each run, unlike std's)
rustc-hash = { version = "2.1", default-features = false, features = ["std"] }
# (libm: its functions, not the platform's, for determinism)
glam = { version = "0.34", default-features = false, features = ["libm"] }
uniffi = { version = "0.32", default-features = false }
# (the engine's spans and events: the log book, the JSON log, and Tracy
# with the dev crate's `tracy` feature; the dependencies' `log` records
# come in through tracing-log)
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "fmt", "json", "tracing-log"] }
tracing-tracy = { version = "0.11", default-features = false, features = ["enable", "ondemand", "only-localhost"] }
# (checks the chant found in the player's default.xbe)
sha2 = { version = "0.10", default-features = false }
# (decodes Custom Edition's Ogg Vorbis sounds)
lewton = { version = "0.10", default-features = false, features = ["ogg"] }
# (the packs' fingerprints, and their compression)
blake3 = { version = "1.8", default-features = false, features = ["std", "rayon"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
# (the snapshot's plain types, checked for padding, and allocated zeroed)
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc", "min_const_generics"] }
# (inflates the Xbox caches)
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
# a panic must not unwind into Swift
panic = "abort"
debug = "line-tables-only"

[profile.dev]
panic = "abort"

[profile.dev.package."*"]
# the dependencies (glam, the decoders, the importer's readers) are built
# once and run in every debug build and test; the workspace's crates stay
# unoptimised so that an edit rebuilds fast
opt-level = 2

[profile.test-opt]
# the game-data suites step the sim for minutes in a debug build; built
# optimised, they keep the checks a debug build has
inherits = "release"
debug-assertions = true
overflow-checks = true
incremental = true
