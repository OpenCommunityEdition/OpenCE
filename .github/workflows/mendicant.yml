# MendicantCE builds: the Linux (32-bit and 64-bit x86) and Windows (32-bit
# and 64-bit) release builds, each packaged with the MENDICANT AI mod folder
# (tools/mendicant/package.py), for every pushed commit; a push to main
# also publishes them as a release, mendicant-<run number>, marked latest.
# Fork-only: OpenCE's own workflows (build.yml, server-image.yml) run only by
# hand here, as they publish OpenCE's site and server image.
name: MendicantCE

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: mendicant-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G
  MODELS: port/assets/mendicant/models.aibw

jobs:
  linux:
    # as build.yml's linux job: Arch Linux for the toolchain, Debian 11's
    # 32-bit glibc for the build (tools/linux_sysroot.py)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git zstd zip python python-pytest python-pillow python-numpy python-scipy ninja ccache \
            clang lld gcc lib32-glibc lib32-gcc-libs cmake pkgconf wayland

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-mendicant-linux-${{ github.sha }}
          restore-keys: ccache-mendicant-linux-

      - uses: actions/cache@v4
        with:
          path: build/linux/third_party
          key: mendicant-linux-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      - name: Release
        run: python tools/ci_build.py linux release

      - name: Test
        run: python -m pytest -q tools/test_linux_port.py tools/test_profile.py

      - name: Package
        run: python tools/mendicant/package.py --game dist/halo-linux-release --models "$MODELS" --out dist/mendicant

      - uses: actions/upload-artifact@v4
        with:
          name: mendicantce-linux
          path: dist/mendicant/*.zip
          retention-days: 7

  linux_x64:
    # the 64-bit x86 Linux build (ninja linux_x86_64, tools/linux_guest_build.py):
    # the game as an x32 guest inside a 64-bit host, which needs no 32-bit
    # libraries; clang's x32 target, lld and llvm's tools, the system's
    # OpenGL, OpenGL ES and EGL headers, and SDL3's X11, Wayland and sound
    # development files (port/linux/README.md, "64-bit x86")
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          pacman -Syu --noconfirm --needed git zstd zip python python-pytest ninja ccache \
            clang lld llvm gcc cmake pkgconf libglvnd mesa \
            libx11 libxext libxrandr libxcursor libxi libxfixes libxss libxtst libxkbcommon \
            wayland wayland-protocols libdecor alsa-lib libpulse pipewire dbus

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-mendicant-linux-x64-${{ github.sha }}
          restore-keys: ccache-mendicant-linux-x64-

      - uses: actions/cache@v4
        with:
          path: build/linux_x86_64/third_party
          key: mendicant-linux-x64-third-party-${{ hashFiles('tools/android_build.py') }}

      - name: Release
        run: python tools/ci_build.py linux_x86_64 release

      - name: Test
        run: |
          python -m pytest -q tools/test_host_units.py tools/test_check_host_imports.py tools/test_host_syscall.py \
            tools/test_guest_image_check.py tools/test_guest_layout.py tools/test_linux_guest_build.py

      - name: Package
        run: python tools/mendicant/package.py --game dist/halo-linux-x86_64-release --models "$MODELS" --out dist/mendicant

      - uses: actions/upload-artifact@v4
        with:
          name: mendicantce-linux-x64
          path: dist/mendicant/*.zip
          retention-days: 7

      # the guest image and the import thunks, which the Windows x64 build
      # carries (tools/windows_x64_build.py)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-kit
          path: build/linux_x86_64/windows_kit
          retention-days: 7

  windows:
    # as build.yml's windows job: the runner has LLVM, Python and Visual
    # Studio's x86 libraries and Windows SDK
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          Invoke-WebRequest -OutFile ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          if ((Get-FileHash ninja.zip -Algorithm SHA256).Hash -ne "F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A") { throw "ninja.zip: unexpected SHA-256" }
          if ((Get-FileHash ccache.zip -Algorithm SHA256).Hash -ne "6252F081876A9A9F700FAE13A5AEC5D0D486B28261D7F1F72AC11C7AD9DF4DA9") { throw "ccache.zip: unexpected SHA-256" }
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\tools"
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64\ccache.exe" "$env:RUNNER_TEMP\tools"
          Remove-Item ninja.zip, ccache.zip
          "$env:RUNNER_TEMP\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-mendicant-windows-${{ github.sha }}
          restore-keys: ccache-mendicant-windows-

      - uses: actions/cache@v4
        with:
          path: build/windows/third_party
          key: mendicant-windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - name: Release
        run: python tools/ci_build.py windows release

      - name: Package
        run: python tools/mendicant/package.py --game dist/halo-windows-release --models "$MODELS" --out dist/mendicant

      - uses: actions/upload-artifact@v4
        with:
          name: mendicantce-windows
          path: dist/mendicant/*.zip
          retention-days: 7

  windows_x64:
    # the Windows x64 build: the linux_x64 job's guest image (its Windows
    # kit) in a 64-bit Windows host (port/windows/host), with the runner's
    # LLVM and Visual Studio's x64 libraries and Windows SDK
    needs: linux_x64
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          Invoke-WebRequest -OutFile ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          if ((Get-FileHash ninja.zip -Algorithm SHA256).Hash -ne "F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A") { throw "ninja.zip: unexpected SHA-256" }
          if ((Get-FileHash ccache.zip -Algorithm SHA256).Hash -ne "6252F081876A9A9F700FAE13A5AEC5D0D486B28261D7F1F72AC11C7AD9DF4DA9") { throw "ccache.zip: unexpected SHA-256" }
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\tools"
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64\ccache.exe" "$env:RUNNER_TEMP\tools"
          Remove-Item ninja.zip, ccache.zip
          "$env:RUNNER_TEMP\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-kit
          path: build/linux_x86_64/windows_kit

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-mendicant-windows-x64-${{ github.sha }}
          restore-keys: ccache-mendicant-windows-x64-

      - uses: actions/cache@v4
        with:
          path: build/windows/third_party
          key: mendicant-windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - name: Release
        run: python tools/ci_build.py windows_x64 release

      - name: Package
        run: python tools/mendicant/package.py --game dist/halo-windows-x64-release --models "$MODELS" --out dist/mendicant

      - uses: actions/upload-artifact@v4
        with:
          name: mendicantce-windows-x64
          path: dist/mendicant/*.zip
          retention-days: 7

  release:
    # the four packages as a release, for main only, when all built
    needs: [linux, linux_x64, windows, windows_x64]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mendicantce-*
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="mendicant-$GITHUB_RUN_NUMBER"
          subject="$(printf '%s' "${MESSAGE:-manual run}" | head -n 1)"
          (cd artifacts && sha256sum *.zip > SHA256SUMS)
          printf '%s\n\nCommit: %s\n\nUnzip into a new folder and start the game; it asks for your own Halo: Combat Evolved Xbox disc image. See README_MENDICANT.txt in the zip.\n' \
            "$subject" "$GITHUB_SHA" > notes.md
          gh release create "$tag" artifacts/* --target "$GITHUB_SHA" --latest \
            --title "MendicantCE $GITHUB_RUN_NUMBER (${GITHUB_SHA:0:7})" --notes-file notes.md
