# The C header of the runtime's C ABI (src/ffi.rs), which the macOS host
# includes: tools/macos_build.py writes it to build/macos/runtime/opence_runtime.h.
language = "C"
include_guard = "OPENCE_RUNTIME_H"
header = "/* The C ABI of the macOS host's runtime (port/macos/runtime/src/ffi.rs). */"
autogen_warning = "/* generated by cbindgen from port/macos/runtime; do not edit */"
include_version = false
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[parse]
parse_deps = false

[export]
include = ["OpenceStatus", "OpenceRegionKind", "OpenceRegion", "OpenceImageInfo"]
# no constants: the crate's are Rust's (some would overflow C's int); where
# the vectors and tables go is in OpenceImageInfo's registers
item_types = ["enums", "structs", "opaque", "functions"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
