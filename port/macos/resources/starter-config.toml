# Halo Combat Evolved settings
# F10 cycles 4:3 (640x480), 720p and 1080p. F11 switches fullscreen.
# F12 releases or recaptures the mouse.
# Edit while the game is closed; existing settings are never replaced on install.

[display]
resolution = "1280x720"
fullscreen = false
window_scale = 1
# Cap fullscreen rendering at 1280 pixels wide while preserving display shape.
# Use 0 for native display resolution, or another width of at least 640.
render_width = 1280
vsync = true
interpolation = true

[audio]
enabled = true
volume = 1.0

[input]
mouse_sensitivity = 1.0
invert_mouse = false
