<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <g id="art">
      <circle cx="126" cy="130" r="126.18" fill="#fff"/>
    </g>
    <mask id="lum" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><use xlink:href="#art"/></mask>
  </defs>
  <!-- white disc -->
  <!-- colour = alpha = grey level: art masked by itself -->
  <g mask="url(#lum)"><rect width="256" height="256" fill="none"/><use xlink:href="#art"/></g>
</svg>
