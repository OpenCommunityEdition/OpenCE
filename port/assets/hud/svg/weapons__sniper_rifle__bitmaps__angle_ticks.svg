    <use xlink:href="#short" y="1960"/>
    <use xlink:href="#long" y="1996"/>
    <use xlink:href="#short" y="2032"/>
  </g>
  <!-- pointer on the left edge, pointing right: translucent fill (119/255) inside a 4 px outline -->
  <polygon points="4,1005.5 24.5,1026 4,1046.5" fill="#2895ff" fill-opacity="0.4667"/>
  <path d="M0,996.5 L29.5,1026 L0,1055.5 Z M4,1005.5 L24.5,1026 L4,1046.5 Z" fill="#2895ff" fill-rule="evenodd"/>
