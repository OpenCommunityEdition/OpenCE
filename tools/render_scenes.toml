name = "b30-auto-player-msaa4x"
map = "b30"
core = "b30-auto"
settings = { HALO_ANTI_ALIASING = "msaa4x" }

[[scene]]
name = "b30-auto-player-fxaa"
map = "b30"
core = "b30-auto"
settings = { HALO_ANTI_ALIASING = "fxaa" }

[[scene]]
name = "b30-auto-player-smaa"
map = "b30"
core = "b30-auto"
settings = { HALO_ANTI_ALIASING = "smaa" }

[[scene]]
name = "a30-auto-player-ssaa2x"
map = "a30"
core = "a30-auto"
settings = { HALO_ANTI_ALIASING = "ssaa2x" }

[[scene]]
name = "c40-auto-player-per-pixel"
map = "c40"
core = "c40-auto"
settings = { HALO_PER_PIXEL_LIGHTING = "1" }

[[scene]]
name = "a10-auto-shadows-1024"
map = "a10"
