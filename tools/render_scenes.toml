# The scenes tools/render_test.py draws with each renderer and compares.
#
# A scene:
#   name          its pictures' name (letters, digits, '-', '_' and '.')
#   map           b30, or a path: levels\test\bloodgulch\bloodgulch
#   core          the game state it starts from (core_save_name, in the
#                 scratch data root's core/; render_test.py author makes it).
#                 Without one, the game is frozen once the map has loaded,
#                 which is not the same tick from run to run: for a first
#                 look only.
#   camera        tools/render_cameras/<camera>.txt (debug_camera_save's);
#                 without one, the player's own view
#   settings      HALO_* environment variables for the run
#   commands      console commands before the picture (at most 127
#                 characters each)
#   settle_frames, threshold, tolerance: as [defaults]

[defaults]
# frames drawn after the picture is asked for, before the one saved: real time
# is held still until then (render_test.py's HALO_FRAME_TIME), so the weather,
# lens flares fading in and cinematics move this many 60ths of a second
settle_frames = 60
# a pixel matches when no channel differs by more than this (of 255)
threshold = 2
# a scene passes when at least this fraction of its pixels match
tolerance = 0.995

# Checks the harness itself (the game starts, the console answers, a frame is
# saved): not the same tick from run to run.
[[scene]]
name = "smoke-b30"
map = "b30"
tolerance = 0.0

# b30 after a minute that no one plays (render_test.py author b30 --scene
# b30-auto --after 60 makes its game state): from the saved camera, and from
# the player's own view (the first-person weapon, the HUD).
[[scene]]
name = "b30-auto"
map = "b30"
core = "b30-auto"
camera = "b30/b30-auto"

[[scene]]
name = "b30-auto-player"
map = "b30"
core = "b30-auto"

