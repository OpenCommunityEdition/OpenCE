map = "d40"
core = "d40-auto"
settings = { HALO_RESOLUTION_SCALING = "original" }

[[scene]]
name = "a30-auto-player-low-res-hud"
map = "a30"
core = "a30-auto"
settings = { HALO_HIGH_RES_HUD = "0", HALO_HIGH_RES_TEXT = "0" }

